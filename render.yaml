services:
  - type: web
    name: tafatafa-backend
    runtime: node
    repo: https://github.com/tsiresydev/Tafatafa.git
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true